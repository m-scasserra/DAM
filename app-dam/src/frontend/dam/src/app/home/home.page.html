<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Home
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>


  <ion-grid>
    <ion-row>
      <ion-col *ngFor="let dispositivo of dispositivos" size="12" size-sm="6" size-md="4" size-lg="3">
        <ion-card appHighlightSensor [dispositivo]="dispositivo">
          <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/card-media.png" />
          <ion-card-header>
            <ion-card-title>
              <a [routerLink]="['/listado-dispositivos', dispositivo.dispositivoId]">
                {{ dispositivo.nombre }}
              </a>
            </ion-card-title>
            <ion-card-subtitle>{{ dispositivo.ubicacion }}</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ng-container *ngIf="dispositivos.length === 0">
    <ion-item lines="none">
      <ion-label>No hay dispositivos disponibles</ion-label>
    </ion-item>
  </ng-container>

</ion-content>
